[package]
name = "codegraphy-desktop"
version = "0.1.0"
description = "CodeGraphy desktop app for macOS"
authors = ["Joe Soboleski"]
edition = "2024"
license = "MIT"
repository = "https://github.com/joesobo/CodeGraphyV4"
rust-version = "1.85"

[lib]
name = "codegraphy_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-shell = "2.3.5"
tempfile = "3.23"
tokio = { version = "1.48", features = ["io-util", "process", "sync"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
# Do not strip the complete Cargo profile. On macOS that also strips host
# proc-macro dylibs, which makes the next release build unable to load them.
